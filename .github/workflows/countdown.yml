name: Daily Countdown Update

on:
 workflow_dispatch: # Manual trigger only (auto-updates disabled)
#  schedule:
    # Runs every day at 3:30 AM IST (10:00 PM UTC previous day)
#    - cron: '0 22 * * *'
#  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

jobs:
  update-countdown:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install dependencies
        run: |
          pip install pytz
      
      - name: Run countdown update script
        run: |
          python3 scripts/update_countdown.py
      
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -n "$(git status --porcelain)" ]; then
            git add README.md
            git commit -m "chore: daily countdown update - $(date -u +'%Y-%m-%d')"
            git push
          else
            echo "No changes to commit."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
